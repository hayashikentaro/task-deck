<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskDeck</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="task-bar" aria-label="Task state">
        <div>
          <p class="eyebrow">TaskDeck MVP</p>
          <h1>Task-aware terminal</h1>
        </div>
        <dl class="state-grid">
          <div>
            <dt>State</dt>
            <dd id="stateValue">idle</dd>
          </div>
          <div>
            <dt>Risk</dt>
            <dd id="riskValue">unknown</dd>
          </div>
          <div>
            <dt>Exit</dt>
            <dd id="exitValue">-</dd>
          </div>
          <div>
            <dt>Runtime</dt>
            <dd id="runtimeValue">0s</dd>
          </div>
        </dl>
      </section>

      <section class="command-panel" aria-label="Command controls">
        <form id="commandForm" class="command-form">
          <label for="commandInput">Command</label>
          <div class="command-row">
            <input id="commandInput" name="command" value="pwd && ls -la" autocomplete="off" />
            <button id="startButton" type="submit">Start</button>
            <button id="interruptButton" type="button">Interrupt</button>
          </div>
        </form>
        <p id="connectionValue" class="connection">Connecting...</p>
      </section>

      <section class="workspace">
        <aside class="task-card" aria-label="Current task">
          <h2>Current Task</h2>
          <dl>
            <div>
              <dt>Command</dt>
              <dd id="commandValue">No task started.</dd>
            </div>
            <div>
              <dt>Started</dt>
              <dd id="startedValue">-</dd>
            </div>
            <div>
              <dt>Updated</dt>
              <dd id="updatedValue">-</dd>
            </div>
          </dl>
        </aside>

        <section class="terminal-wrap" aria-label="Terminal">
          <pre id="terminal" tabindex="0" aria-live="polite"></pre>
        </section>
      </section>
    </main>

    <script type="module" src="/main.js"></script>
  </body>
</html>
